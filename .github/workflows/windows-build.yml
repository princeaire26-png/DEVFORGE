name: DEVFORGE Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devforge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build DEVFORGE for Windows
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Verify project structure
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "Missing package.json at repository root."
          }

          if (!(Test-Path "src-tauri/tauri.conf.json")) {
            throw "Missing src-tauri/tauri.conf.json."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build Windows desktop app
        run: npm run build:desktop

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"

          if (!(Test-Path $bundle)) {
            throw "Build output folder not found: $bundle"
          }

          $files = Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }

          $exe = $files | Where-Object { $_.Extension -eq ".exe" -and $_.Length -gt 0 }
          $msi = $files | Where-Object { $_.Extension -eq ".msi" -and $_.Length -gt 0 }
          $empty = $files | Where-Object { $_.Length -le 0 }

          if (!$exe -or !$msi -or $empty) {
            Get-ChildItem $bundle -Recurse -File |
              Select-Object FullName, Length

            throw "Expected non-empty EXE and MSI installers; build output is incomplete."
          }

          $files | ForEach-Object {
            Write-Host "Installer: $($_.FullName)"
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DEVFORGE-Windows-Installers
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 14
