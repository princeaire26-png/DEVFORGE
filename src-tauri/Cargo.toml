[package]
name = "devforge"
version = "1.5.1"
description = "DEVFORGE native Windows AI software factory"
authors = ["DEVFORGE"]
edition = "2021"

[lib]
name = "devforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-core"]
native-core = []
wasm-extensions = ["dep:wasmtime"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "38", optional = true }
